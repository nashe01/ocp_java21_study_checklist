<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCP Java 21 — Study Checklist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%235382a1'/%3E%3Cg fill='none' stroke='%23e76f00' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M20 4c-3 3 0 6 0 9s-2.5 5 0 8'/%3E%3Cpath d='M27 6c-2.5 2.5 0 5 0 7.5s-2 4 0 6.5'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Cpath d='M11 24h23v9a8 8 0 0 1-8 8h-7a8 8 0 0 1-8-8z'/%3E%3Cpath d='M34 25.5h3.5a4.5 4.5 0 0 1 0 9H34v-3.2h3.3a1.3 1.3 0 0 0 0-2.6H34z'/%3E%3Crect x='10' y='43' width='25' height='2.6' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #fbfbfc;
    --surface-hover: #f2f4f7;
    --border: #e6e8ec;
    --border-strong: #d5d8de;
    --text: #1a1c22;
    --text-secondary: #5b616e;
    --text-muted: #a0a5b0;
    --primary: #5382a1;      /* Java blue */
    --primary-strong: #3f6a86;
    --accent: #e76f00;       /* Java cup orange */
    --success: #2e9e6b;
    --success-soft: #e4f3ec;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05);
    --ring: rgba(83,130,161,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f25;
      --surface-2: #191c21;
      --surface-hover: #23272e;
      --border: #2c313a;
      --border-strong: #3a404b;
      --text: #eceef2;
      --text-secondary: #a3aab6;
      --text-muted: #6b7280;
      --primary: #6ba3c6;
      --primary-strong: #86b6d4;
      --accent: #ff8c2e;
      --success: #43c78a;
      --success-soft: #16302440;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --ring: rgba(107,163,198,.4);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb, var(--primary) 8%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 96px; }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo {
    flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--primary), var(--primary-strong));
    color: #fff;
    font-weight: 700; font-size: 19px;
    letter-spacing: .5px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.2px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .btn {
    flex-shrink: 0;
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-secondary);
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 13px;
    border-radius: 9px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--surface-hover); color: var(--text); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }

  /* ---------- Progress panel ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 26px;
  }
  .panel-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .pct { font-size: 30px; font-weight: 700; letter-spacing: -.5px; line-height: 1; }
  .pct small { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-left: 2px; }
  .count { font-size: 13px; color: var(--text-secondary); text-align: right; }
  .count b { color: var(--text); font-weight: 600; }
  .bar { height: 10px; background: var(--surface-hover); border-radius: 99px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--primary), var(--success));
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .milestone { margin-top: 12px; font-size: 12.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 7px; }
  .milestone svg { width: 14px; height: 14px; color: var(--accent); flex-shrink: 0; }

  /* ---------- Phase ---------- */
  .phase-head {
    display: flex; align-items: center; gap: 10px;
    margin: 30px 2px 12px;
  }
  .phase-head:first-of-type { margin-top: 6px; }
  .phase-title { font-size: 12px; font-weight: 650; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .7px; white-space: nowrap; }
  .phase-line { flex: 1; height: 1px; background: var(--border); }
  .phase-prog { font-size: 12px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Week card ---------- */
  details.week {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  details.week[open] { box-shadow: var(--shadow); border-color: var(--border-strong); }
  details.week.done { border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
  summary {
    list-style: none;
    padding: 14px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 13px;
    user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--surface-hover); }
  .chev { flex-shrink: 0; width: 16px; height: 16px; color: var(--text-muted); transition: transform .2s; }
  details[open] .chev { transform: rotate(90deg); }
  .wk-num {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    background: var(--surface-hover);
    color: var(--text-secondary);
    font-size: 12px; font-weight: 650;
    font-variant-numeric: tabular-nums;
    transition: background .2s, color .2s;
  }
  details.done .wk-num { background: var(--success); color: #fff; }
  .wk-meta { min-width: 0; flex: 1; }
  .wk-title { font-size: 14.5px; font-weight: 600; letter-spacing: -.1px; }
  .wk-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .wk-ring { flex-shrink: 0; position: relative; width: 30px; height: 30px; }
  .wk-ring svg { transform: rotate(-90deg); display: block; }
  .wk-ring .track { stroke: var(--surface-hover); }
  .wk-ring .fill { stroke: var(--success); stroke-linecap: round; transition: stroke-dashoffset .4s; }
  .wk-ring span {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .days { padding: 2px 16px 12px 16px; }
  .day {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 6px 11px 6px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    border-radius: 8px;
    transition: background .12s;
  }
  .day:hover { background: var(--surface-hover); }
  .day input { position: absolute; opacity: 0; width: 0; height: 0; }
  .box {
    flex-shrink: 0; margin-top: 1px;
    width: 19px; height: 19px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .box svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .day input:checked + .box { background: var(--success); border-color: var(--success); }
  .day input:checked + .box svg { opacity: 1; transform: scale(1); }
  .day input:focus-visible + .box { box-shadow: 0 0 0 3px var(--ring); }
  .day-text { min-width: 0; font-size: 14px; }
  .day-name {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .4px;
    margin-right: 8px;
    min-width: 30px;
  }
  .day.friday .day-name { color: var(--accent); }
  .day-topic { color: var(--text); }
  .day.checked .day-topic { text-decoration: line-through; color: var(--text-muted); }
  .day.checked .day-name { opacity: .55; }

  footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-muted); }

  @media (max-width: 560px) {
    .wrap { padding: 22px 14px 80px; }
    .wk-sub { display: none; }
    .pct { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="logo" aria-label="Java">
        <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
          <!-- steam -->
          <g fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round">
            <path d="M20 4c-3 3 0 6 0 9s-2.5 5 0 8"/>
            <path d="M27 6c-2.5 2.5 0 5 0 7.5s-2 4 0 6.5"/>
          </g>
          <!-- cup -->
          <g fill="#fff">
            <path d="M11 24h23v9a8 8 0 0 1-8 8h-7a8 8 0 0 1-8-8z"/>
            <path d="M34 25.5h3.5a4.5 4.5 0 0 1 0 9H34v-3.2h3.3a1.3 1.3 0 0 0 0-2.6H34z"/>
            <rect x="10" y="43" width="25" height="2.6" rx="1.3"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>OCP Java 21 Study Checklist</h1>
        <div class="subtitle">6-month plan &middot; 26 weeks &middot; 130 study days</div>
      </div>
    </div>
    <button class="btn" id="reset-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Reset
    </button>
  </div>

  <div class="panel">
    <div class="panel-top">
      <div class="pct" id="pct">0<small>%</small></div>
      <div class="count" id="count"><b>0</b> of 130 days complete</div>
    </div>
    <div class="bar"><div id="progress-bar"></div></div>
    <div class="milestone" id="milestone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
      <span id="milestone-text">Let's get started — check off your first day.</span>
    </div>
  </div>

  <div id="weeks-container"></div>

  <footer>Progress saves automatically in this browser.</footer>
</div>

<script>
(function(){
  const data = [
    {phase:"Phase 1: Foundations", weeks:[
      {n:1, title:"Ch.1 Kickstarter for Beginners", days:[
        ["Mon","1.1–1.3: OOP key points, why something is so, declaration & definition"],
        ["Tue","1.4–1.6: class–object–reference relationship, static vs instance, stack vs heap"],
        ["Wed","1.7–1.9: conventions, common terms, Java identifiers"],
        ["Thu","1.10: writing/compiling/running programs, do exercise 1.10.10 + 1.11 Logging API"],
        ["Fri","Revision: reread weak spots + redo Ch.1 quiz"]]},
      {n:2, title:"Ch.2 Primitive Data Types", days:[
        ["Mon","Data types, variable types, reference vs primitive variables"],
        ["Tue","Declaring/initializing variables, default values"],
        ["Wed","Operators, precedence rules, type conversion"],
        ["Thu","Casting, Math API, arithmetic & boolean expressions"],
        ["Fri","Revision: redo Ch.2 quiz, write practice programs using casting/operators"]]},
      {n:3, title:"Text & Date-Time", days:[
        ["Mon","String and StringBuilder"],
        ["Tue","Text blocks"],
        ["Wed","Date, time, duration, period, instant"],
        ["Thu","Time-zones, daylight saving handling"],
        ["Fri","Revision: redo quiz, write a program combining String + Date-Time API"]]},
      {n:4, title:"Controlling Program Flow", days:[
        ["Mon","if/else, switch statements"],
        ["Tue","switch expressions"],
        ["Wed","loops (for, while, do-while)"],
        ["Thu","break/continue, labeled statements, practice programs"],
        ["Fri","Revision: redo quiz + mini review of Weeks 1–4 combined"]]}
    ]},
    {phase:"Phase 2: Object-Oriented Programming", weeks:[
      {n:5, title:"OOP Basics", days:[
        ["Mon","Declaring/instantiating objects, nested classes"],
        ["Tue","Object life-cycle, creation, reassigning references"],
        ["Wed","Garbage collection"],
        ["Thu","Practice: build a small multi-class program from scratch"],
        ["Fri","Revision: redo quiz, review Weeks 1–5 flashcards"]]},
      {n:6, title:"Classes & Encapsulation", days:[
        ["Mon","Instance/static fields & methods, constructors"],
        ["Tue","Initializers, overloaded methods, var-arg methods"],
        ["Wed","Variable scope, encapsulation"],
        ["Thu","Immutable objects, local variable type inference (var)"],
        ["Fri","Revision: redo quiz + rewrite one class fully encapsulated/immutable"]]},
      {n:7, title:"Inheritance & Polymorphism", days:[
        ["Mon","Abstract classes, sealed types"],
        ["Tue","Records"],
        ["Wed","Method overriding, the Object class"],
        ["Thu","Polymorphism, object vs reference type, casting, instanceof"],
        ["Fri","Revision: redo quiz, build a small class hierarchy exercise"]]},
      {n:8, title:"Pattern Matching + Interfaces", days:[
        ["Mon","Pattern matching with instanceof"],
        ["Tue","Pattern matching with switch (Java 21-specific)"],
        ["Wed","Interfaces, functional interfaces"],
        ["Thu","Private/static/default interface methods"],
        ["Fri","Revision: redo quiz, extra pattern-matching practice snippets"]]},
      {n:9, title:"Enums + Exceptions", days:[
        ["Mon","Enum types with fields, methods, constructors"],
        ["Tue","try/catch/finally"],
        ["Wed","try-with-resources, multi-catch"],
        ["Thu","Custom exceptions"],
        ["Fri","Revision: redo quiz + full Phase 2 recap (Weeks 5–9)"]]}
    ]},
    {phase:"Phase 3: Data Structures & Functional Programming", weeks:[
      {n:10, title:"Arrays", days:[
        ["Mon","Creating arrays"],
        ["Tue","Adding, removing, updating, retrieving elements"],
        ["Wed","Sorting arrays, multi-dimensional arrays"],
        ["Thu","Practice exercises"],
        ["Fri","Revision: redo quiz"]]},
      {n:11, title:"Collections", days:[
        ["Mon","List"],
        ["Tue","Set"],
        ["Wed","Map"],
        ["Thu","Deque + when to use which structure"],
        ["Fri","Revision: redo quiz, write a program using all four"]]},
      {n:12, title:"Lambdas & Functional Interfaces", days:[
        ["Mon","Lambda syntax"],
        ["Tue","Functional interfaces"],
        ["Wed","Method references"],
        ["Thu","Practice: write 5–6 lambdas from scratch"],
        ["Fri","Revision: redo quiz"]]},
      {n:13, title:"Streams (Part 1)", days:[
        ["Mon","Object streams"],
        ["Tue","Primitive streams"],
        ["Wed","Filter, transform, process"],
        ["Thu","Sort data, build a full stream pipeline unaided"],
        ["Fri","Revision: redo quiz"]]},
      {n:14, title:"Streams (Part 2) — heaviest topic", days:[
        ["Mon","Decomposition, concatenation"],
        ["Tue","Reduction"],
        ["Wed","Grouping and partitioning"],
        ["Thu","Sequential vs parallel streams"],
        ["Fri","Revision: redo quiz + full Streams recap (Weeks 12–14)"]]}
    ]},
    {phase:"Phase 4: Systems & Advanced Topics", weeks:[
      {n:15, title:"Modules (JPMS)", days:[
        ["Mon","Defining modules, exposing content"],
        ["Tue","Reflection, module dependencies"],
        ["Wed","Services, providers, consumers"],
        ["Thu","Compiling modular/non-modular jars, runtime images, migration"],
        ["Fri","Revision: redo quiz"]]},
      {n:16, title:"Concurrency (Part 1)", days:[
        ["Mon","Platform threads"],
        ["Tue","Virtual threads (Java 21 headline feature)"],
        ["Wed","Runnable and Callable objects"],
        ["Thu","Thread lifecycle, executor services"],
        ["Fri","Revision: redo quiz"]]},
      {n:17, title:"Concurrency (Part 2)", days:[
        ["Mon","Thread-safe code, locking mechanisms"],
        ["Tue","Concurrent API"],
        ["Wed","Processing collections concurrently"],
        ["Thu","Parallel streams"],
        ["Fri","Revision: redo quiz + full Concurrency recap (Weeks 16–17)"]]},
      {n:18, title:"Java I/O API", days:[
        ["Mon","Console I/O"],
        ["Tue","File I/O streams"],
        ["Wed","Serialization/deserialization"],
        ["Thu","java.nio.file Path objects"],
        ["Fri","Revision: redo quiz"]]},
      {n:19, title:"Localization", days:[
        ["Mon","Locales"],
        ["Tue","Resource bundles"],
        ["Wed","Parsing/formatting messages, dates, times"],
        ["Thu","Numbers, currency, percentages + annotations"],
        ["Fri","Revision: redo quiz — last new-content week"]]}
    ]},
    {phase:"Phase 5: Consolidation & Practice Exams", weeks:[
      {n:20, title:"Full Review Pass 1", days:[
        ["Mon","Re-read weakest chapters, Weeks 1–9"],
        ["Tue","Re-read weakest chapters, Weeks 1–9"],
        ["Wed","Re-read weakest chapters, Weeks 1–9"],
        ["Thu","Re-read weakest chapters, Weeks 1–9"],
        ["Fri","Redo every Weeks 1–9 quiz scored under 80%"]]},
      {n:21, title:"Full Review Pass 2", days:[
        ["Mon","Re-read weakest chapters, Weeks 10–19"],
        ["Tue","Re-read weakest chapters, Weeks 10–19"],
        ["Wed","Re-read weakest chapters, Weeks 10–19"],
        ["Thu","Re-read weakest chapters, Weeks 10–19"],
        ["Fri","Redo every Weeks 10–19 quiz scored under 80%"]]},
      {n:22, title:"Sectionwise Mock Tests", days:[
        ["Mon","Sectionwise test: Foundations objectives"],
        ["Tue","Sectionwise test: OOP objectives"],
        ["Wed","Sectionwise test: Collections/Streams objectives"],
        ["Thu","Sectionwise test: Concurrency/IO/Modules/Localization"],
        ["Fri","Log every wrong answer by topic, reread those spots"]]},
      {n:23, title:"Repeat Weak Sections + First Full Mock", days:[
        ["Mon","Re-take sectionwise tests on weakest areas"],
        ["Tue","Keep drilling until consistently 80%+"],
        ["Wed","Rest / light review"],
        ["Thu","Full mock exam #1, timed"],
        ["Fri","Review every mistake from mock #1 in detail"]]},
      {n:24, title:"Full Mock Exams", days:[
        ["Mon","Full mock exam #2"],
        ["Tue","Review mistakes"],
        ["Wed","Full mock exam #3"],
        ["Thu","Review mistakes"],
        ["Fri","Targeted repair on recurring weak topics"]]},
      {n:25, title:"Final Mock Exams", days:[
        ["Mon","Full mock exam #4 (fresh question set)"],
        ["Tue","Review mistakes"],
        ["Wed","Full mock exam #5"],
        ["Thu","Review mistakes"],
        ["Fri","Light review only — confirm exam date booked"]]},
      {n:26, title:"Exam Week", days:[
        ["Mon","Light targeted review only — no new material"],
        ["Tue","Light review of your own summary notes"],
        ["Wed","Rest, no studying"],
        ["Thu","Very light skim of anything unsure about"],
        ["Fri","Exam day (or final rest day before it)"]]}
    ]}
  ];

  const STORAGE_KEY = 'ocp-checklist-state';
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

  let checkedState = {};
  let allIds = [];

  function loadState(){
    try { checkedState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { checkedState = {}; }
  }
  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedState)); }
    catch (e) { /* private mode / quota */ }
  }

  function ringSVG(){
    const r = 12, c = 2 * Math.PI * r;
    return '<svg width="30" height="30" viewBox="0 0 30 30">'
      + '<circle class="track" cx="15" cy="15" r="'+r+'" fill="none" stroke-width="3"/>'
      + '<circle class="fill" cx="15" cy="15" r="'+r+'" fill="none" stroke-width="3" '
      + 'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+c.toFixed(2)+'"/></svg>';
  }

  function buildDOM(){
    const container = document.getElementById('weeks-container');
    const frag = document.createDocumentFragment();

    data.forEach(phase => {
      const head = document.createElement('div');
      head.className = 'phase-head';
      head.innerHTML = '<div class="phase-title">' + phase.phase + '</div>'
        + '<div class="phase-line"></div>'
        + '<div class="phase-prog" id="phase-prog-' + slug(phase.phase) + '"></div>';
      frag.appendChild(head);

      phase.weeks.forEach(week => {
        const details = document.createElement('details');
        details.className = 'week';
        details.id = 'week-' + week.n;

        const summary = document.createElement('summary');
        summary.innerHTML = CHEV_SVG
          + '<div class="wk-num" id="wk-num-' + week.n + '">' + week.n + '</div>'
          + '<div class="wk-meta"><div class="wk-title">' + esc(week.title) + '</div>'
          + '<div class="wk-sub">Week ' + week.n + '</div></div>'
          + '<div class="wk-ring" id="wk-ring-' + week.n + '">' + ringSVG()
          + '<span id="wk-count-' + week.n + '">0/5</span></div>';
        details.appendChild(summary);

        const days = document.createElement('div');
        days.className = 'days';
        week.days.forEach(([day, topic]) => {
          const id = 'w' + week.n + '-' + day;
          allIds.push(id);
          const row = document.createElement('label');
          row.className = 'day' + (day === 'Fri' ? ' friday' : '');
          row.id = 'row-' + id;
          row.innerHTML = '<input type="checkbox" id="' + id + '">'
            + '<span class="box">' + CHECK_SVG + '</span>'
            + '<span class="day-text"><span class="day-name">' + day + '</span>'
            + '<span class="day-topic">' + esc(topic) + '</span></span>';
          row.querySelector('input').addEventListener('change', onCheck);
          days.appendChild(row);
        });
        details.appendChild(days);
        frag.appendChild(details);
      });
    });
    container.appendChild(frag);
  }

  function onCheck(e){
    checkedState[e.target.id] = e.target.checked;
    saveState();
    updateVisuals();
  }

  function updateVisuals(){
    let total = 0;
    const c = 2 * Math.PI * 12;

    data.forEach(phase => {
      let phaseChecked = 0, phaseTotal = 0;
      phase.weeks.forEach(week => {
        let wk = 0;
        week.days.forEach(([day]) => {
          const id = 'w' + week.n + '-' + day;
          const on = !!checkedState[id];
          const cb = document.getElementById(id);
          if (cb) cb.checked = on;
          const row = document.getElementById('row-' + id);
          if (row) row.classList.toggle('checked', on);
          if (on) { wk++; total++; phaseChecked++; }
          phaseTotal++;
        });
        const count = document.getElementById('wk-count-' + week.n);
        if (count) count.textContent = wk + '/5';
        const ring = document.querySelector('#wk-ring-' + week.n + ' .fill');
        if (ring) ring.style.strokeDashoffset = (c * (1 - wk / 5)).toFixed(2);
        const det = document.getElementById('week-' + week.n);
        if (det) det.classList.toggle('done', wk === 5);
      });
      const pp = document.getElementById('phase-prog-' + slug(phase.phase));
      if (pp) pp.textContent = phaseChecked + '/' + phaseTotal;
    });

    const pct = Math.round((total / allIds.length) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('pct').innerHTML = pct + '<small>%</small>';
    document.getElementById('count').innerHTML = '<b>' + total + '</b> of ' + allIds.length + ' days complete';
    document.getElementById('milestone-text').textContent = milestoneText(total, pct);
  }

  function milestoneText(total, pct){
    if (total === 0) return "Let's get started — check off your first day.";
    if (pct === 100) return "🎉 All 130 days complete — go book that exam!";
    if (pct >= 75) return "Home stretch — into the mock exams now.";
    if (pct >= 50) return "Over halfway there. Keep the streak going.";
    if (pct >= 25) return "Solid momentum — Phase foundations are landing.";
    return "Great start — " + total + " day" + (total === 1 ? "" : "s") + " down, " + (allIds.length - total) + " to go.";
  }

  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Reset all progress? This clears every check.')) return;
    checkedState = {};
    saveState();
    updateVisuals();
  });

  loadState();
  buildDOM();
  updateVisuals();
})();
</script>
</body>
</html>
